<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris Restaurant Map - Très Très Bon</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Search and Filters Header -->
        <header class="header">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Rechercher un restaurant..." class="search-input">
                <button id="filterBtn" class="filter-btn">🔍 Filtres</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Map Container -->
            <div id="mapContainer" class="map-container">
                <div id="map" class="map"></div>
                <div id="loading" class="map-loading">
                    <div class="spinner"></div>
                    <p>Chargement des restaurants...</p>
                </div>
            </div>

            <!-- Bottom Sheet -->
            <div id="bottomSheet" class="bottom-sheet">
                <div class="sheet-handle">
                    <div class="drag-indicator"></div>
                </div>
                
                <div class="sheet-content">
                    <div class="sheet-header">
                        <h2 id="restaurantsCount">227 restaurants</h2>
                        <button id="sortBtn" class="sort-btn">↕ Trier</button>
                    </div>

                    <div class="filters-summary">
                        <div id="activeFilters" class="active-filters"></div>
                    </div>

                    <div id="restaurantList" class="restaurant-list"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Filter Modal -->
    <div id="filterModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Filtres</h3>
                <button id="closeModal" class="close-btn">×</button>
            </div>
            
            <div class="modal-body">
                <!-- Type Filters -->
                <div class="filter-section">
                    <h4>Type de restaurant</h4>
                    <div class="filter-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="type" value="La Table">
                            <span class="checkmark"></span>
                            La Table
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="type" value="Street-food">
                            <span class="checkmark"></span>
                            Street-food
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="type" value="Bec sucré">
                            <span class="checkmark"></span>
                            Bec sucré
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="type" value="Boui-boui">
                            <span class="checkmark"></span>
                            Boui-boui
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="type" value="Le panier">
                            <span class="checkmark"></span>
                            Le panier
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="type" value="Cave">
                            <span class="checkmark"></span>
                            Cave
                        </label>
                    </div>
                </div>

                <!-- Cuisine Filters -->
                <div class="filter-section">
                    <h4>Cuisine</h4>
                    <div class="filter-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="cuisine" value="Français">
                            <span class="checkmark"></span>
                            Français
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="cuisine" value="Italien">
                            <span class="checkmark"></span>
                            Italien
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="cuisine" value="Asiatique">
                            <span class="checkmark"></span>
                            Asiatique
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="cuisine" value="Autre">
                            <span class="checkmark"></span>
                            Autre
                        </label>
                    </div>
                </div>

                <!-- Budget Filters -->
                <div class="filter-section">
                    <h4>Budget</h4>
                    <div class="filter-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="budget" value="1">
                            <span class="checkmark"></span>
                            € (Abordable)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="budget" value="2">
                            <span class="checkmark"></span>
                            €€ (Moyen)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="budget" value="3">
                            <span class="checkmark"></span>
                            €€€ (Premium)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="budget" value="4">
                            <span class="checkmark"></span>
                            €€€€ (Luxe)
                        </label>
                    </div>
                </div>

                <!-- Arrondissement Filters -->
                <div class="filter-section">
                    <h4>Arrondissement</h4>
                    <div class="filter-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="1">
                            <span class="checkmark"></span>
                            1er
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="2">
                            <span class="checkmark"></span>
                            2e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="3">
                            <span class="checkmark"></span>
                            3e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="4">
                            <span class="checkmark"></span>
                            4e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="5">
                            <span class="checkmark"></span>
                            5e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="6">
                            <span class="checkmark"></span>
                            6e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="7">
                            <span class="checkmark"></span>
                            7e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="8">
                            <span class="checkmark"></span>
                            8e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="9">
                            <span class="checkmark"></span>
                            9e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="10">
                            <span class="checkmark"></span>
                            10e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="11">
                            <span class="checkmark"></span>
                            11e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="12">
                            <span class="checkmark"></span>
                            12e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="13">
                            <span class="checkmark"></span>
                            13e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="14">
                            <span class="checkmark"></span>
                            14e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="15">
                            <span class="checkmark"></span>
                            15e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="16">
                            <span class="checkmark"></span>
                            16e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="17">
                            <span class="checkmark"></span>
                            17e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="18">
                            <span class="checkmark"></span>
                            18e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="19">
                            <span class="checkmark"></span>
                            19e
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="arrondissement" value="20">
                            <span class="checkmark"></span>
                            20e
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="modal-footer">
                <button id="resetFilters" class="btn btn-secondary">Réinitialiser</button>
                <div class="modal-actions">
                    <button id="applyFilters" class="btn btn-primary">Appliquer</button>
                    <button id="cancelFilters" class="btn btn-outline">Annuler</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Restaurant Detail Modal -->
    <div id="restaurantModal" class="modal">
        <div class="modal-content large">
            <div class="modal-header">
                <h3 id="restaurantName"></h3>
                <button id="closeRestaurantModal" class="close-btn">×</button>
            </div>
            
            <div class="modal-body">
                <div class="restaurant-header">
                    <div class="restaurant-image">
                        <img id="restaurantImage" src="" alt="">
                    </div>
                    <div class="restaurant-info">
                        <div class="restaurant-type" id="restaurantType"></div>
                        <div class="restaurant-address">
                            <span id="restaurantAddress"></span>
                            <span class="metro-badge" id="restaurantMetro"></span>
                        </div>
                        <div class="restaurant-rating">
                            <span class="rating-number" id="restaurantRating"></span>
                            <span class="rating-count">(54 avis)</span>
                        </div>
                    </div>
                </div>
                
                <div class="restaurant-description" id="restaurantDescription"></div>
                
                <div class="restaurant-actions">
                    <button class="btn btn-primary">Appeler</button>
                    <button class="btn btn-secondary">Directions</button>
                    <button class="btn btn-outline">Site web</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
