<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Paris Restaurant Map | Très Très Bon</title>
    
    <!-- MapLibre CSS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        /* Bottom sheet animations */
        .bottom-sheet {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Metro line colors */
        .metro-1 { background: #FFCE00; color: #000; }
        .metro-2 { background: #0055C8; color: #fff; }
        .metro-3 { background: #6E6E00; color: #fff; }
        .metro-4 { background: #A0006E; color: #fff; }
        .metro-5 { background: #FF7E2E; color: #fff; }
        .metro-6 { background: #6EC4E8; color: #000; }
        .metro-7 { background: #6ECA97; color: #000; }
        .metro-8 { background: #6E491E; color: #fff; }
        .metro-9 { background: #6EC4E8; color: #000; }
        .metro-10 { background: #C9910D; color: #000; }
        .metro-11 { background: #6E491E; color: #fff; }
        .metro-12 { background: #003A6E; color: #fff; }
        .metro-13 { background: #6EC4E8; color: #000; }
        .metro-14 { background: #6E0055; color: #fff; }
        
        /* Map marker styles */
        .map-marker {
            cursor: pointer;
            transition: transform 0.2s;
        }
        .map-marker:hover {
            transform: scale(1.2);
        }
        
        /* Prevent pull-to-refresh on mobile */
        body {
            overscroll-behavior-y: none;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-gray-50">
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-900 mx-auto mb-4"></div>
            <p class="text-gray-600">Chargement des restaurants...</p>
        </div>
    </div>

    <!-- Error Screen -->
    <div id="error-screen" class="hidden fixed inset-0 bg-white z-50 flex items-center justify-center p-4">
        <div class="text-center">
            <i data-lucide="alert-circle" class="w-16 h-16 text-red-500 mx-auto mb-4"></i>
            <h2 class="text-xl font-bold mb-2">Erreur de chargement</h2>
            <p id="error-message" class="text-gray-600 mb-4"></p>
            <button onclick="location.reload()" class="px-4 py-2 bg-blue-900 text-white rounded-lg">
                Réessayer
            </button>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map" class="absolute inset-0 z-0"></div>

    <!-- Search Bar -->
    <div class="absolute top-4 left-4 right-4 z-10">
        <div class="bg-white rounded-full shadow-lg flex items-center gap-2 p-2">
            <div class="flex items-center gap-2 flex-1 px-3">
                <i data-lucide="search" class="w-5 h-5 text-gray-400"></i>
                <input 
                    type="text" 
                    id="search-input"
                    placeholder="Rechercher un restaurant..."
                    class="flex-1 outline-none text-gray-900 placeholder-gray-400 bg-transparent"
                >
            </div>
            <button id="filter-btn" class="flex items-center gap-1.5 px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-full transition-colors">
                <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                <span class="text-sm font-medium">Filtres</span>
                <span id="filter-count" class="text-xs bg-blue-900 text-white px-1.5 py-0.5 rounded-full hidden">0</span>
            </button>
        </div>
    </div>

    <!-- Bottom Sheet -->
    <div id="bottom-sheet" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl shadow-2xl z-20 bottom-sheet" style="height: 90px;">
        <!-- Drag Handle -->
        <div id="sheet-handle" class="flex items-center justify-center py-3 cursor-grab active:cursor-grabbing">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
        </div>
        
        <!-- Sheet Content -->
        <div id="sheet-content" class="overflow-y-auto px-4" style="height: calc(100% - 40px);">
            <!-- Dynamic content will be inserted here -->
        </div>
    </div>

    <!-- Filter Modal -->
    <div id="filter-modal" class="hidden fixed inset-0 z-50">
        <div class="absolute inset-0 bg-black/50" onclick="closeFilterModal()"></div>
        <div class="absolute inset-x-0 bottom-0 bg-white rounded-t-3xl max-h-[90vh] overflow-hidden">
            <div class="flex items-center justify-between p-4 border-b">
                <h2 class="text-lg font-semibold">Filtres</h2>
                <button onclick="closeFilterModal()">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            
            <div class="overflow-y-auto p-4 space-y-6" style="max-height: calc(90vh - 140px);">
                <!-- Budget Filter -->
                <div>
                    <h3 class="font-medium mb-3">Budget</h3>
                    <div id="budget-filters" class="flex flex-wrap gap-2">
                        <!-- Dynamic -->
                    </div>
                </div>
                
                <!-- Type Filter -->
                <div>
                    <h3 class="font-medium mb-3">Type</h3>
                    <div id="type-filters" class="flex flex-wrap gap-2">
                        <!-- Dynamic -->
                    </div>
                </div>
                
                <!-- Cuisine Filter -->
                <div>
                    <h3 class="font-medium mb-3">Cuisine</h3>
                    <div id="cuisine-filters" class="flex flex-wrap gap-2">
                        <!-- Dynamic -->
                    </div>
                </div>
            </div>
            
            <div class="p-4 border-t bg-white">
                <button onclick="applyFilters()" class="w-full py-3 bg-blue-900 text-white rounded-xl font-medium">
                    Afficher <span id="result-count">0</span> restaurants
                </button>
            </div>
        </div>
    </div>

    <!-- MapLibre JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
    
    <script>
        // Global state
        let restaurants = [];
        let filteredRestaurants = [];
        let selectedRestaurant = null;
        let map = null;
        let markers = [];
        let filters = {
            budgets: [],
            types: [],
            cuisines: [],
            search: ''
        };
        
        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            
            try {
                await loadRestaurants();
                initMap();
                setupBottomSheet();
                setupFilters();
                setupSearch();
                renderRestaurantList();
                
                document.getElementById('loading-screen').classList.add('hidden');
            } catch (err) {
                console.error('Init error:', err);
                showError(err.message);
            }
        });
        
        // Load data
        async function loadRestaurants() {
            const response = await fetch('./data/restaurants_latest.jsonl');
            if (!response.ok) throw new Error('HTTP ' + response.status);
            
            const text = await response.text();
            const lines = text.trim().split('\n');
            
            restaurants = lines.map(line => {
                const data = JSON.parse(line);
                return {
                    id: data.id,
                    name: data.name,
                    chef: data.chef,
                    street: data.street,
                    zip: data.zip,
                    city: data.city,
                    metroStation: data.metro_station,
                    metroLine: data.metro_line,
                    latitude: parseFloat(data.latitude),
                    longitude: parseFloat(data.longitude),
                    type: data.type,
                    cuisine: data.cuisine,
                    budget: data.budget,
                    website: data.website,
                    descriptionShort: data.description_short,
                    descriptionLong: data.description_long,
                    imageUrl: data.image_url
                };
            });
            
            filteredRestaurants = [...restaurants];
            console.log('Loaded', restaurants.length, 'restaurants');
        }
        
        // Initialize map
        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
                center: [2.3522, 48.8566],
                zoom: 12
            });
            
            map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
            map.addControl(new maplibregl.GeolocateControl(), 'bottom-right');
            
            map.on('load', () => {
                renderMarkers();
            });
        }
        
        // Render markers
        function renderMarkers() {
            // Clear existing markers
            markers.forEach(m => m.remove());
            markers = [];
            
            filteredRestaurants.forEach(r => {
                if (!r.latitude || !r.longitude) return;
                
                const el = document.createElement('div');
                el.className = 'map-marker';
                el.innerHTML = `
                    <div style="position: relative; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">
                        <svg width="32" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" fill="${getMetroColor(r.metroLine)}"/>
                        </svg>
                        <span style="position: absolute; top: 8px; left: 50%; transform: translateX(-50%); 
                                     color: white; font-weight: bold; font-size: 10px;">${r.budget}</span>
                    </div>
                `;
                
                const marker = new maplibregl.Marker(el)
                    .setLngLat([r.longitude, r.latitude])
                    .addTo(map);
                
                el.addEventListener('click', () => selectRestaurant(r));
                markers.push(marker);
            });
        }
        
        // Get metro color
        function getMetroColor(line) {
            const colors = {
                '1': '#FFCE00', '2': '#0055C8', '3': '#6E6E00', '4': '#A0006E',
                '5': '#FF7E2E', '6': '#6EC4E8', '7': '#6ECA97', '8': '#6E491E',
                '9': '#6EC4E8', '10': '#C9910D', '11': '#6E491E', '12': '#003A6E',
                '13': '#6EC4E8', '14': '#6E0055', '31': '#6EC4E8'
            };
            return colors[line] || '#6B7280';
        }
        
        // Render restaurant list
        function renderRestaurantList() {
            const container = document.getElementById('sheet-content');
            
            if (selectedRestaurant) {
                renderRestaurantDetail(container);
            } else {
                renderRestaurantListView(container);
            }
        }
        
        function renderRestaurantListView(container) {
            if (filteredRestaurants.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <p>Aucun restaurant ne correspond</p>
                        <button onclick="clearFilters()" class="mt-2 text-blue-900 hover:underline">
                            Effacer les filtres
                        </button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filteredRestaurants.map(r => `
                <div onclick='selectRestaurant(${JSON.stringify(r).replace(/'/g, "&#39;")})' 
                     class="cursor-pointer mb-3">
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-3 hover:shadow-md transition-shadow">
                        <div class="flex gap-3">
                            ${r.imageUrl ? `
                                <img src="${r.imageUrl}" alt="${r.name}" 
                                     class="w-20 h-20 object-cover rounded-md flex-shrink-0" loading="lazy">
                            ` : ''}
                            <div class="flex-1 min-w-0">
                                <h3 class="font-semibold text-gray-900 truncate">${r.name}</h3>
                                <p class="text-sm text-gray-600">${r.type} • ${r.cuisine}</p>
                                <p class="text-sm text-gray-500 truncate">${r.metroStation || ''}</p>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-sm font-medium text-blue-900">
                                        ${'€'.repeat(parseInt(r.budget) || 1)}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function renderRestaurantDetail(container) {
            const r = selectedRestaurant;
            container.innerHTML = `
                <div class="pb-20">
                    <button onclick="closeRestaurantDetail()" class="absolute top-4 right-4 p-2 bg-gray-100 rounded-full z-10">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                    
                    ${r.imageUrl ? `
                        <div class="relative w-full h-48 rounded-xl overflow-hidden mb-4">
                            <img src="${r.imageUrl}" alt="${r.name}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                            <div class="absolute bottom-4 left-4 right-4">
                                <h2 class="text-2xl font-bold text-white">${r.name}</h2>
                                ${r.chef ? `<p class="text-white/90">par ${r.chef}</p>` : ''}
                            </div>
                        </div>
                    ` : `<h2 class="text-2xl font-bold mb-2">${r.name}</h2>`}
                    
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="px-3 py-1 bg-gray-100 rounded-full text-sm font-medium">${r.type}</span>
                        <span class="px-3 py-1 bg-gray-100 rounded-full text-sm">${r.cuisine}</span>
                        <span class="px-3 py-1 bg-blue-100 text-blue-900 rounded-full text-sm font-medium">
                            ${'€'.repeat(parseInt(r.budget) || 1)}
                        </span>
                    </div>
                    
                    ${r.metroStation ? `
                        <div class="flex items-center gap-2 text-gray-700 mb-2">
                            <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold text-white metro-${r.metroLine}">
                                M
                            </span>
                            <span>${r.metroStation}</span>
                            <span class="text-gray-500">(Ligne ${r.metroLine})</span>
                        </div>
                    ` : ''}
                    
                    <div class="flex items-start gap-2 text-gray-700 mb-4">
                        <i data-lucide="map-pin" class="w-5 h-5 mt-0.5 flex-shrink-0"></i>
                        <div>
                            <p>${r.street}</p>
                            <p>${r.zip} ${r.city}</p>
                        </div>
                    </div>
                    
                    ${r.descriptionShort ? `
                        <div class="bg-gray-50 p-4 rounded-xl mb-4">
                            <p class="text-gray-800 font-medium mb-2">${r.descriptionShort}</p>
                            ${r.descriptionLong ? `<p class="text-gray-600 text-sm">${r.descriptionLong}</p>` : ''}
                        </div>
                    ` : ''}
                    
                    <div class="flex gap-3">
                        ${r.website ? `
                            <a href="${r.website}" target="_blank" rel="noopener noreferrer"
                               class="flex-1 flex items-center justify-center gap-2 py-3 bg-blue-900 text-white rounded-xl font-medium">
                                <i data-lucide="external-link" class="w-5 h-5"></i>
                                Site web
                            </a>
                        ` : ''}
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(r.street + ', ' + r.zip + ' ' + r.city)}"
                           target="_blank" rel="noopener noreferrer"
                           class="flex-1 flex items-center justify-center gap-2 py-3 bg-gray-100 text-gray-900 rounded-xl font-medium">
                            <i data-lucide="map-pin" class="w-5 h-5"></i>
                            Itinéraire
                        </a>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }
        
        // Select restaurant
        function selectRestaurant(restaurant) {
            selectedRestaurant = restaurant;
            renderRestaurantList();
            expandSheet();
            
            if (map && restaurant.latitude && restaurant.longitude) {
                map.flyTo({
                    center: [restaurant.longitude, restaurant.latitude],
                    zoom: 16
                });
            }
        }
        
        function closeRestaurantDetail() {
            selectedRestaurant = null;
            renderRestaurantList();
        }
        
        // Bottom sheet
        let sheetState = 'collapsed'; // collapsed, half, full
        
        function setupBottomSheet() {
            const handle = document.getElementById('sheet-handle');
            const sheet = document.getElementById('bottom-sheet');
            let startY, startHeight;
            
            handle.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                startHeight = sheet.offsetHeight;
            }, {passive: true});
            
            handle.addEventListener('touchmove', (e) => {
                const deltaY = startY - e.touches[0].clientY;
                const newHeight = Math.min(Math.max(startHeight + deltaY, 90), window.innerHeight * 0.9);
                sheet.style.height = newHeight + 'px';
            }, {passive: true});
            
            handle.addEventListener('touchend', (e) => {
                const endY = e.changedTouches[0].clientY;
                const deltaY = startY - endY;
                
                if (deltaY > 50) {
                    // Swipe up
                    if (sheetState === 'collapsed') setSheetState('half');
                    else if (sheetState === 'half') setSheetState('full');
                } else if (deltaY < -50) {
                    // Swipe down
                    if (sheetState === 'full') setSheetState('half');
                    else if (sheetState === 'half') {
                        if (selectedRestaurant) {
                            closeRestaurantDetail();
                        }
                        setSheetState('collapsed');
                    }
                } else {
                    // Snap to nearest
                    const height = sheet.offsetHeight;
                    if (height < 200) setSheetState('collapsed');
                    else if (height < window.innerHeight * 0.6) setSheetState('half');
                    else setSheetState('full');
                }
            });
            
            // Click to expand
            sheet.addEventListener('click', (e) => {
                if (sheetState === 'collapsed' && e.target.closest('#sheet-handle')) {
                    setSheetState('half');
                }
            });
        }
        
        function setSheetState(state) {
            sheetState = state;
            const sheet = document.getElementById('bottom-sheet');
            
            switch(state) {
                case 'collapsed':
                    sheet.style.height = '90px';
                    break;
                case 'half':
                    sheet.style.height = '50vh';
                    break;
                case 'full':
                    sheet.style.height = '90vh';
                    break;
            }
        }
        
        function expandSheet() {
            setSheetState('half');
        }
        
        // Search
        function setupSearch() {
            const input = document.getElementById('search-input');
            input.addEventListener('input', (e) => {
                filters.search = e.target.value.toLowerCase();
                applyFilters();
            });
        }
        
        // Filters
        function setupFilters() {
            // Get unique values
            const budgets = [...new Set(restaurants.map(r => r.budget))].sort();
            const types = [...new Set(restaurants.map(r => r.type))].sort();
            const cuisines = [...new Set(restaurants.map(r => r.cuisine))].sort().slice(0, 15);
            
            // Render budget filters
            document.getElementById('budget-filters').innerHTML = budgets.map(b => `
                <button onclick="toggleFilter('budgets', '${b}')" 
                        class="filter-chip px-4 py-2 rounded-full border transition-colors"
                        data-filter="budgets" data-value="${b}">
                    ${'€'.repeat(parseInt(b))}
                </button>
            `).join('');
            
            // Render type filters
            document.getElementById('type-filters').innerHTML = types.map(t => `
                <button onclick="toggleFilter('types', '${t}')" 
                        class="filter-chip px-3 py-1.5 rounded-full text-sm border transition-colors"
                        data-filter="types" data-value="${t}">
                    ${t}
                </button>
            `).join('');
            
            // Render cuisine filters
            document.getElementById('cuisine-filters').innerHTML = cuisines.map(c => `
                <button onclick="toggleFilter('cuisines', '${c}')" 
                        class="filter-chip px-3 py-1.5 rounded-full text-sm border transition-colors"
                        data-filter="cuisines" data-value="${c}">
                    ${c}
                </button>
            `).join('');
            
            // Open filter modal
            document.getElementById('filter-btn').addEventListener('click', () => {
                document.getElementById('filter-modal').classList.remove('hidden');
                updateResultCount();
            });
        }
        
        function toggleFilter(category, value) {
            const index = filters[category].indexOf(value);
            if (index > -1) {
                filters[category].splice(index, 1);
            } else {
                filters[category].push(value);
            }
            
            // Update UI
            document.querySelectorAll(`[data-filter="${category}"][data-value="${value}"]`)
                .forEach(el => {
                    if (filters[category].includes(value)) {
                        el.classList.add('bg-blue-900', 'text-white', 'border-blue-900');
                        el.classList.remove('bg-white', 'border-gray-300');
                    } else {
                        el.classList.remove('bg-blue-900', 'text-white', 'border-blue-900');
                        el.classList.add('bg-white', 'border-gray-300');
                    }
                });
            
            updateResultCount();
        }
        
        function applyFilters() {
            filteredRestaurants = restaurants.filter(r => {
                if (filters.budgets.length && !filters.budgets.includes(r.budget)) return false;
                if (filters.types.length && !filters.types.includes(r.type)) return false;
                if (filters.cuisines.length && !filters.cuisines.includes(r.cuisine)) return false;
                if (filters.search) {
                    const searchText = `${r.name} ${r.cuisine} ${r.type} ${r.street} ${r.metroStation}`.toLowerCase();
                    if (!searchText.includes(filters.search)) return false;
                }
                return true;
            });
            
            renderRestaurantList();
            renderMarkers();
            closeFilterModal();
            
            // Update filter count badge
            const totalFilters = filters.budgets.length + filters.types.length + filters.cuisines.length;
            const badge = document.getElementById('filter-count');
            if (totalFilters > 0) {
                badge.textContent = totalFilters;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }
        
        function clearFilters() {
            filters = { budgets: [], types: [], cuisines: [], search: '' };
            document.getElementById('search-input').value = '';
            document.querySelectorAll('.filter-chip').forEach(el => {
                el.classList.remove('bg-blue-900', 'text-white', 'border-blue-900');
                el.classList.add('bg-white', 'border-gray-300');
            });
            applyFilters();
        }
        
        function closeFilterModal() {
            document.getElementById('filter-modal').classList.add('hidden');
        }
        
        function updateResultCount() {
            const count = restaurants.filter(r => {
                if (filters.budgets.length && !filters.budgets.includes(r.budget)) return false;
                if (filters.types.length && !filters.types.includes(r.type)) return false;
                if (filters.cuisines.length && !filters.cuisines.includes(r.cuisine)) return false;
                return true;
            }).length;
            document.getElementById('result-count').textContent = count;
        }
        
        function showError(message) {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('error-screen').classList.remove('hidden');
            document.getElementById('error-message').textContent = message;
            lucide.createIcons();
        }
    </script>
</body>
</html>
